name: Exact long artifact repetition replay
on:
  push:
    branches: [qa/minutes-long-repetition-replay]
    paths: ['.github/workflows/minutes-long-repetition-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Test conservative repetition coverage
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_repeated_topic_coverage.py tests/test_minutes_consolidated_strategy.py tests/test_minutes_source_coverage.py tests/test_minutes_evidence.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 45994579450
          name: consolidated-long-source-qa
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Reconstruct actual long report without inference
        run: python qa/minutes_long_repetition_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-repetition-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
