name: Literal theme repetition presentation replay
on:
  push:
    branches: [qa/minutes-theme-repetition-presentation]
    paths: ['.github/workflows/minutes-theme-repetition.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Focused regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_theme_presentation.py tests/test_minutes_localized_pipeline.py tests/test_minutes_localization.py tests/test_minutes_repeated_topic_coverage.py tests/test_minutes_consolidated_strategy.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 45994579450
          name: consolidated-long-source-qa
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - uses: actions/download-artifact@v4
        with:
          run-id: 46009865198
          name: protected-weekday-replay
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/localized
      - name: Re-render exact saved evidence
        run: python qa/minutes_theme_repetition_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/localized" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compacted-long-presentation
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
