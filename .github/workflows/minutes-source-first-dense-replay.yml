name: Dense descriptive sentence exact replay
on:
  push:
    branches: [qa/minutes-source-first-integrated-0819]
    paths: ['.github/workflows/minutes-source-first-dense-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Validate source-first and existing classification regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_source_first.py tests/test_minutes_evidence.py tests/test_minutes_discussion_classification.py tests/test_minutes_varied_coverage.py tests/test_minutes_consolidated_classification.py tests/test_minutes_localization.py tests/test_minutes_localized_pipeline.py tests/test_minutes_editorial_modality.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 46059887920
          name: source-first-dense-qa
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Revalidate recorded completed metadata responses
        run: python qa/minutes_source_first_dense_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-first-dense-classification-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
