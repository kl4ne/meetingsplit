name: Contextual ASR window structural preflight
on:
  push:
    branches: [qa/minutes-context-windows-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Run context partition and citation regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_context_windows.py
      - name: Structural comparison on independent fragmented speech fixture
        run: python qa/minutes_context_windows_preflight.py "$RUNNER_TEMP/context-preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-windows-preflight
          path: ${{ runner.temp }}/context-preflight
          if-no-files-found: warn
          retention-days: 7
