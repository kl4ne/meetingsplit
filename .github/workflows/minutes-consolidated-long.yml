name: Long bilingual consolidated minutes acceptance (source only)
on:
  push:
    branches: [qa/minutes-consolidated-long-0818]
    paths: ['.github/workflows/minutes-consolidated-long.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Preflight consolidation and minutes regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_consolidated_classification.py tests/test_minutes_consolidated_strategy.py tests/test_minutes_source_coverage.py tests/test_minutes_citation_presentation.py tests/test_minutes_selective_quote_retry.py tests/test_minutes_editorial.py tests/test_minutes_repair_checkpoint.py tests/test_minutes_editorial_gap_retry.py tests/test_minutes_selective_recovery.py
      - name: Prepare isolated pinned Ollama (synthetic QA only)
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/ms-models"
          echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ms-ollama" "$OLLAMA_MODELS"
          curl --fail --location --retry 2 --max-time 360 -o "$RUNNER_TEMP/ollama.tar.zst" https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst
          echo "b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ms-ollama"
          exe="$RUNNER_TEMP/ms-ollama/bin/ollama"
          "$exe" serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ollama.pid"
          for i in {1..60}; do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          timeout 600 "$exe" pull qwen3.5:9b
          "$exe" list
      - name: Run historical long fixture with consolidated strategy
        shell: bash
        run: python qa/minutes_consolidated_long.py "$RUNNER_TEMP/ms-long"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-long-source-qa
          path: ${{ runner.temp }}/ms-long/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated service
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/ollama.pid"; then kill "$(cat "$RUNNER_TEMP/ollama.pid")" || true; fi
