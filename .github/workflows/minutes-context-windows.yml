name: Restore original typographic quote pair exact replay
on:
  push:
    branches: [qa/minutes-context-windows-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@v4
        with:
          run-id: 46095783519
          name: claim-attribution-live
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Claim-local regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_context_claims.py tests/test_minutes_context_row_citations.py tests/test_minutes_context_interruptions.py
      - name: Strict archived claim response replay
        run: python qa/minutes_context_quote_pair_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/quote-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claim-quote-pair-replay
          path: ${{ runner.temp }}/quote-replay
          if-no-files-found: warn
          retention-days: 7
