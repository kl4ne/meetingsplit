name: Offline minutes consolidation comparison
on:
  push:
    branches: [qa/minutes-consolidation-offline-0818]
    paths: ['.github/workflows/minutes-consolidation-offline.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@v4
        with:
          name: repaired-pipeline-short-7fb2290
          run-id: 45955174164
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Compare existing evidence and recorded narrative without inference
        run: python qa/minutes_offline_consolidation.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/consolidation"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-minutes-consolidation
          path: ${{ runner.temp }}/consolidation
          retention-days: 7
