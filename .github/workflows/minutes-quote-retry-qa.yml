name: Isolated selective quotation retry regressions
on:
  push:
    branches: [qa/minutes-quote-retry-0818-95746f9]
    paths: ['.github/workflows/minutes-quote-retry-qa.yml']
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Run minutes regressions without inference
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_selective_quote_retry.py tests/test_minutes_evidence.py tests/test_ollama_minutes_budget.py tests/test_minutes_editorial.py tests/test_minutes_source_coverage.py tests/test_minutes_repair_checkpoint.py tests/test_minutes_selective_recovery.py tests/test_minutes_editorial_gap_retry.py tests/test_minutes_ab_replay_regression.py
