name: Patched Windows runtime feasibility - no packaging
on:
  push:
    branches: [qa/patched-runtime-086-b48f7e1]
    paths: ['.github/workflows/patched-runtime-qa.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Install existing pinned requirements without changing product
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
      - name: Capture native runtime and imports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          .\.venv\Scripts\python.exe qa/patched_runtime_qa.py
      - name: Focused native runtime regression tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_inference_worker.py tests/test_minutes_evidence.py tests/test_release_gate_strict.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-runtime-compatibility
          path: work/runtime-compatibility.json
          if-no-files-found: warn
