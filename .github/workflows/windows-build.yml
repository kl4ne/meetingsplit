name: Windows build - manual and gated

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'engine/**'
      - 'desktop/**'
      - 'ui/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'run.py'
  workflow_dispatch:
    inputs:
      package_for_qa:
        description: 'Build development installer for QA only (no release)'
        type: boolean
        default: false

concurrency:
  group: windows-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install --upgrade 'pip>=26.1.2'
          choco install ffmpeg --yes --no-progress
          # Installer tooling is needed only for an explicit packaging run.
          # Chocolatey .exe shims cannot be copied into the binary package.
          $packageDir = Join-Path $env:ChocolateyInstall 'lib\ffmpeg'
          $ffmpeg = Get-ChildItem -Path $packageDir -Recurse -File -Filter 'ffmpeg.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem -Path $packageDir -Recurse -File -Filter 'ffprobe.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Chocolatey FFmpeg binaries not found' }
          New-Item -ItemType Directory -Force 'bin' | Out-Null
          Copy-Item -LiteralPath $ffmpeg -Destination 'bin\ffmpeg.exe' -Force
          Copy-Item -LiteralPath $ffprobe -Destination 'bin\ffprobe.exe' -Force
          .\bin\ffmpeg.exe -version | Select-Object -First 1
          .\bin\ffprobe.exe -version | Select-Object -First 1
      - name: Python engine and integration tests
        # The packaging script runs this same suite itself; avoid running it twice.
        if: github.event_name != 'workflow_dispatch' || !inputs.package_for_qa
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q --ignore=tests/test_ui_language.py --ignore=tests/test_ui_navigation.py
      - name: Install optional packaging tool
        if: github.event_name == 'workflow_dispatch' && inputs.package_for_qa
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile native Windows EXE and optional Setup
        if: (github.event_name == 'workflow_dispatch' && inputs.package_for_qa)
        shell: cmd
        run: scripts\compilar_windows.bat
      - name: Verify installer and portable archive were generated
        if: (github.event_name == 'workflow_dispatch' && inputs.package_for_qa)
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/MeetingSplit-v0.8.6-Windows-portable.zip')) { throw 'Portable package missing' }
          if (-not (Test-Path 'dist/MeetingSplit_Setup_v0.8.6.exe')) { throw 'Windows installer missing' }
      - name: Test installer on disposable runner
        if: (github.event_name == 'workflow_dispatch' && inputs.package_for_qa)
        shell: pwsh
        run: ./qa/windows_installer_smoke.ps1
      - name: Upload development portable QA artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.package_for_qa)
        uses: actions/upload-artifact@v4
        with:
          name: MeetingSplit-development-QA-portable-${{ github.sha }}
          path: dist/MeetingSplit-v0.8.6-Windows-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload development installer QA artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.package_for_qa)
        uses: actions/upload-artifact@v4
        with:
          name: MeetingSplit-development-QA-installer-${{ github.sha }}
          path: dist/MeetingSplit_Setup_v0.8.6.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload development QA and license reports
        if: (github.event_name == 'workflow_dispatch' && inputs.package_for_qa)
        uses: actions/upload-artifact@v4
        with:
          name: MeetingSplit-development-QA-reports-${{ github.sha }}
          path: |
            work/installer-smoke/installer-qa.json
            build/legal
            build/native-inventory.json
          if-no-files-found: error
          retention-days: 14
