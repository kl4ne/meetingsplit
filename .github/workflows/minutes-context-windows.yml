name: Claim failure-path and exact structured source repair offline
on:
  push:
    branches: [qa/minutes-context-windows-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@v4
        with:
          run-id: 46097495438
          name: claim-full-live
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Failure-path and integrated regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_claim_failure_path.py tests/test_minutes_context_claim_integration.py tests/test_minutes_context_adapter.py tests/test_minutes_context_claims.py tests/test_minutes_compact_overview.py
      - name: Counterfactual archived failure path
        run: python qa/minutes_claim_failure_replay.py "$RUNNER_TEMP/original/context-live" "$RUNNER_TEMP/failure-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claim-failure-replay
          path: ${{ runner.temp }}/failure-replay
          if-no-files-found: warn
          retention-days: 7
