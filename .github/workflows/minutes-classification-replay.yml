name: Replay actual consolidated minutes classification
on:
  push:
    branches: [qa/minutes-consolidated-short-0818]
    paths: ['.github/workflows/minutes-classification-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Validate source regressions (literal patch repair)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_consolidated_classification.py tests/test_minutes_consolidated_strategy.py tests/test_minutes_citation_presentation.py tests/test_minutes_selective_quote_retry.py tests/test_minutes_evidence.py tests/test_minutes_source_coverage.py tests/test_minutes_editorial.py tests/test_minutes_repair_checkpoint.py tests/test_minutes_editorial_gap_retry.py tests/test_minutes_selective_recovery.py tests/test_minutes_ab_replay_regression.py tests/test_ollama_minutes_budget.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 45959825859
          name: consolidated-short-candidate
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Replay actual extraction output and render consolidated minutes
        run: python qa/minutes_classification_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-classification-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
