name: MeetingSplit CPU-only source smoke (no Windows build)

on:
  push:
    branches: [qa/release-evidence-20261021]
    paths: ['.github/workflows/qa-cpu-only-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small unit test runner only
        run: python -m pip install --disable-pip-version-check -q 'pytest>=8,<10'
      - name: Compile every Python source file without native dependencies
        run: python -m compileall -q engine desktop qa tests run.py
      - name: CPU-only Whisper and Ollama source regressions
        run: python -m pytest -q tests/test_gpu_progress_truth.py tests/test_runtime_recovery.py tests/test_cancel_and_integration.py tests/test_ollama_setup_receipt.py
      - name: JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/locales.js
      - name: Prove release gate stays blocked
        run: |
          python -c "from qa.check_release_gate import main; assert main()==2"
          python -c "import json; g=json.load(open('qa/release_gate.json')); assert not g['release_allowed']; assert all('gpu' not in k for k in g['required'])"
