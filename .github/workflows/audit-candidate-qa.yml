name: Patched runtime 0.8.6 - isolated package QA

on:
  push:
    branches: [qa/patched-package-086-9eef50b]
    paths:
      - '.github/workflows/audit-candidate-qa.yml'

permissions:
  contents: read

concurrency:
  group: audit-candidate-qa-9eef50b
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Verify QA-only candidate and closed release gate
        shell: pwsh
        run: |
          $parent = git rev-parse HEAD^
          if ($parent -ne '9eef50b2d865004c7d598bf0932f688a5934994c') { throw 'Unexpected QA candidate parent' }
          $changed = @(git diff-tree --no-commit-id --name-only -r HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/audit-candidate-qa.yml') { throw 'QA source differs from media-refresh candidate' }
          $gate = Get-Content qa/release_gate.json -Raw | ConvertFrom-Json
          if ($gate.release_allowed -ne $false) { throw 'Release must remain blocked' }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade 'pip==26.3'
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          choco install ffmpeg --yes --no-progress
          # Installer tooling is needed only for an explicit packaging run.
          # Chocolatey .exe shims cannot be copied into the binary package.
          $packageDir = Join-Path $env:ChocolateyInstall 'lib\ffmpeg'
          $ffmpeg = Get-ChildItem -Path $packageDir -Recurse -File -Filter 'ffmpeg.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem -Path $packageDir -Recurse -File -Filter 'ffprobe.exe' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Chocolatey FFmpeg binaries not found' }
          New-Item -ItemType Directory -Force 'bin' | Out-Null
          Copy-Item -LiteralPath $ffmpeg -Destination 'bin\ffmpeg.exe' -Force
          Copy-Item -LiteralPath $ffprobe -Destination 'bin\ffprobe.exe' -Force
          .\bin\ffmpeg.exe -version | Select-Object -First 1
          .\bin\ffprobe.exe -version | Select-Object -First 1
      - name: Prepare verified LGPL FFmpeg and source-built PyAV (QA packaging only)
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        shell: pwsh
        run: ./scripts/prepare_lgpl_media.ps1
      - name: Install optional packaging tool
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile native Windows EXE and optional Setup
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        shell: cmd
        run: scripts\compilar_windows.bat
      - name: Verify installer and portable archive were generated
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/MeetingSplit-v0.8.6-Windows-portable.zip')) { throw 'Portable package missing' }
          if (-not (Test-Path 'dist/MeetingSplit_Setup_v0.8.6.exe')) { throw 'Windows installer missing' }
      - name: Test installer on disposable runner
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        shell: pwsh
        run: ./qa/windows_installer_smoke.ps1
      - name: Confirm frozen runtime security versions
        shell: pwsh
        run: |
          $check = Get-Content work/installer-smoke/installer-qa.json -Raw | ConvertFrom-Json
          $runtime = $check.frozen_self_check
          if ($runtime.python -ne '3.14.10') { throw 'Incorrect frozen interpreter' }
          if ($runtime.openssl -notmatch '^OpenSSL (\d+\.\d+\.\d+)') { throw 'Unknown frozen OpenSSL' }
          if ([version]$Matches[1] -lt [version]'3.5.9') { throw 'Old frozen OpenSSL' }
          if ([version]$runtime.sqlite -lt [version]'3.50.4') { throw 'Old frozen SQLite' }
          $runtime | ConvertTo-Json -Depth 10
      - name: Upload development portable QA artifact
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        uses: actions/upload-artifact@v4
        with:
          name: MeetingSplit-development-QA-portable-${{ github.sha }}
          path: dist/MeetingSplit-v0.8.6-Windows-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload development installer QA artifact
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        uses: actions/upload-artifact@v4
        with:
          name: MeetingSplit-development-QA-installer-${{ github.sha }}
          path: dist/MeetingSplit_Setup_v0.8.6.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload development QA and license reports
        if: github.ref == 'refs/heads/qa/patched-package-086-9eef50b'
        uses: actions/upload-artifact@v4
        with:
          name: MeetingSplit-development-QA-reports-${{ github.sha }}
          path: |
            work/installer-smoke/installer-qa.json
            build/legal
            build/native-inventory.json
            build/native-provenance.json
            build/lgpl-wheel/lgpl-media-receipt.json
          if-no-files-found: error
          retention-days: 14

