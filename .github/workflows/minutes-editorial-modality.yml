name: Exact editorial modality replay
on:
  push:
    branches: [qa/minutes-editorial-modality-0819]
    paths: ['.github/workflows/minutes-editorial-modality.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Focused regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_editorial_modality.py tests/test_minutes_editorial.py tests/test_minutes_varied_coverage.py tests/test_minutes_editorial_gap_retry.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 46031770427
          name: varied-targeted-repair
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Revalidate exact saved themes
        run: python qa/minutes_editorial_modality_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-modality-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
