name: Contextual review presentation exact replay
on:
  push:
    branches: [qa/minutes-context-windows-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Context and rendering regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_context_gap_presentation.py tests/test_minutes_context_adapter.py tests/test_minutes_context_windows.py tests/test_minutes_context_row_citations.py tests/test_minutes_context_interruptions.py tests/test_minutes_source_accounting.py tests/test_minutes_localized_pipeline.py tests/test_minutes_report_modes.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 46090327742
          name: context-adapter-live
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Strict complete replay with original evidence unchanged
        run: python qa/minutes_context_gap_replay.py "$RUNNER_TEMP/prior" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-gap-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
