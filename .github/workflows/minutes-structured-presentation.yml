name: Structured event presentation replay
on:
  push:
    branches: [qa/minutes-structured-presentation-0819]
    paths: ['.github/workflows/minutes-structured-presentation.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Focused presentation regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_structured_presentation.py tests/test_minutes_theme_presentation.py tests/test_minutes_localized_pipeline.py tests/test_minutes_localization.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 46015163014
          name: integrated-localized-short
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Re-render exact integrated evidence
        run: python qa/minutes_structured_presentation_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-presentation-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
