name: Claim attribution and bounded recovery offline preflight
on:
  push:
    branches: [qa/minutes-context-windows-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Claim and contextual regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_context_claims.py tests/test_minutes_context_row_citations.py tests/test_minutes_context_windows.py tests/test_minutes_context_interruptions.py tests/test_minutes_context_adapter.py
      - name: Independent fictional attribution fixture
        run: python qa/minutes_context_claims_preflight.py "$RUNNER_TEMP/claim-preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claim-attribution-preflight
          path: ${{ runner.temp }}/claim-preflight
          if-no-files-found: warn
          retention-days: 7
