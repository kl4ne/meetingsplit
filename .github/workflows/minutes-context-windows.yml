name: Contextual interruption review exact offline replay
on:
  push:
    branches: [qa/minutes-context-windows-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Context and interruption regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_context_windows.py tests/test_minutes_context_row_citations.py tests/test_minutes_context_interruptions.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 46089422183
          name: context-row-citations-focal
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Replay archived response without Ollama
        run: python qa/minutes_context_interruption_replay.py "$RUNNER_TEMP/prior" "$RUNNER_TEMP/interruption-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextual-interruption-replay
          path: ${{ runner.temp }}/interruption-replay
          if-no-files-found: warn
          retention-days: 7
