name: Exact descriptive discussion replay
on:
  push:
    branches: [qa/minutes-discussion-classification-0819]
    paths: ['.github/workflows/minutes-discussion-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Test descriptive discussion and safeguards
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_discussion_classification.py tests/test_minutes_evidence.py tests/test_minutes_consolidated_classification.py tests/test_minutes_structured_presentation.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 46015163014
          name: integrated-localized-short
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Replay recorded extraction
        run: python qa/minutes_discussion_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/replayed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descriptive-discussion-replay
          path: ${{ runner.temp }}/replayed
          if-no-files-found: warn
          retention-days: 7
