name: Compact combined overview isolated replay
on:
  push:
    branches: [qa/minutes-compact-overview-0819]
    paths: ['.github/workflows/minutes-context-windows.yml']
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/download-artifact@v4
        with:
          run-id: 46090327742
          name: context-adapter-live
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - uses: actions/download-artifact@v4
        with:
          run-id: 46093000998
          name: context-gap-replay
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Combined presentation tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_minutes_compact_overview.py tests/test_minutes_context_adapter.py
      - name: Strict existing response replay
        run: python qa/minutes_compact_overview_replay.py "$RUNNER_TEMP/original" "$RUNNER_TEMP/prior" "$RUNNER_TEMP/overview-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-overview-replay
          path: ${{ runner.temp }}/overview-replay
          if-no-files-found: warn
          retention-days: 7
